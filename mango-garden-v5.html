<!DOCTYPE html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>สวนมะม่วงมะปราง</title>
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff3d0;--card:#fffdf5;--ink:#3b2a14;--mut:#8a7556;--pri:#e58a00;--grn:#4a9b3c;--line:#ecdcb4;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1d2316;--card:#2a311f;--ink:#f6ebcf;--mut:#b5a888;--line:#444c33}}
:root[data-theme="dark"]{--bg:#1d2316;--card:#2a311f;--ink:#f6ebcf;--mut:#b5a888;--line:#444c33}
html,body{height:100%;margin:0}body{background:var(--bg);color:var(--ink);font-family:Kanit,sans-serif;-webkit-tap-highlight-color:transparent}
#app{height:100%;display:flex;flex-direction:column;max-width:520px;margin:0 auto}
header{display:flex;align-items:center;gap:10px;padding:8px 12px;background:var(--card);border-bottom:2px solid var(--line)}
.av{position:relative;display:inline-block;font-size:30px;line-height:1;padding-top:12px}.av i{position:absolute;top:-1px;left:50%;transform:translateX(-50%);font-size:19px;font-style:normal}
.hd{flex:1;font-size:13px;line-height:1.3}.hd b{font-size:15px}.coin{font-weight:600;color:var(--pri);font-size:17px}
main{flex:1;overflow-y:auto;padding:12px}
nav{display:flex;background:var(--card);border-top:2px solid var(--line)}nav button{flex:1;border:0;background:none;padding:8px 0;font:inherit;font-size:11px;color:var(--mut)}nav button span{display:block;font-size:20px}nav button.on{color:var(--pri);font-weight:600}
.card{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px}
.btn{background:var(--pri);color:#fff;border:0;border-radius:10px;padding:9px 14px;font:inherit;font-size:14px}.btn.g{background:var(--grn)}.btn.ghost{background:var(--line);color:var(--ink)}.btn:disabled{opacity:.5}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.sp{flex:1}.mut{color:var(--mut);font-size:12px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.cell{aspect-ratio:1;border-radius:14px;background:#8b5a2b33;border:2px dashed #8b5a2b66;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;font-size:34px;user-select:none}
.cell.rp{border-color:var(--pri);background:#ffc84a44;border-style:solid}.cell.lk{opacity:.6;font-size:22px}
.cell .f{position:absolute;top:2px;right:6px;font-size:20px}.cell .w{position:absolute;top:2px;left:6px;font-size:16px}
.cell .bar{position:absolute;bottom:6px;left:10%;width:80%;height:5px;background:#0003;border-radius:3px;overflow:hidden}.cell .bar u{display:block;height:100%;background:var(--grn);width:0}
.night #farm{filter:brightness(.7)}
.chip{padding:6px 10px;border-radius:20px;border:2px solid var(--line);background:var(--card);font:inherit;font-size:13px;color:var(--ink)}.chip.on{border-color:var(--pri);background:#ffc84a55}
.up{color:#2e9e4f}.dn{color:#d6453d}
#toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 64px);transform:translateX(-50%);background:#3b2a14ee;color:#fff;padding:8px 14px;border-radius:20px;font-size:13px;opacity:0;transition:.3s;pointer-events:none;z-index:9;max-width:90%;text-align:center}
#m,#cr{position:fixed;inset:0;background:#000a;display:none;align-items:center;justify-content:center;z-index:5;padding:16px}
.box{background:var(--card);border-radius:18px;padding:16px;width:100%;max-width:380px;text-align:center}
.fb{position:relative;height:26px;background:#3a8fb744;border-radius:13px;margin:12px 0}#fz{position:absolute;top:0;height:100%;width:30%;background:#4a9b3c;border-radius:13px;opacity:.8}#fk{position:absolute;top:-3px;width:4%;height:32px;background:#d6453d;border-radius:4px}
#pl{position:relative;height:300px;background:linear-gradient(#bfe6ff,#d6f2c0);border-radius:12px;overflow:hidden;margin:8px 0;touch-action:manipulation}
.fl{position:absolute;top:-40px;font-size:34px;animation:fall 2.2s linear forwards;user-select:none}@keyframes fall{to{top:310px}}
input.t{width:100%;box-sizing:border-box;padding:10px;border-radius:10px;border:2px solid var(--line);font:inherit;font-size:16px;background:var(--bg);color:var(--ink)}
.pk{display:flex;gap:8px;justify-content:center;margin:8px 0}.pk button{font-size:28px;padding:4px 8px;border-radius:12px;border:3px solid transparent;background:var(--bg)}.pk button.on{border-color:var(--pri)}
.dp{display:grid;grid-template-columns:repeat(3,50px);grid-template-rows:repeat(3,50px);gap:3px}.dp button{border:0;border-radius:12px;background:var(--line);color:var(--ink);font-size:20px;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
</style></head><body>
<div id="app"><header id="hd"></header><main id="mn"></main><nav id="nv"></nav></div>
<div id="toast"></div><div id="m"></div><div id="cr"></div>
<script>
const $=s=>document.querySelector(s);const DL=300;/* 1 วัน = 300 วินาที = 5 นาที */
const gtime=()=>{const h=(S.t%DL)/DL,m=Math.floor(((h<.7?6+h/.7*14:20+(h-.7)/.3*10)%24)*60/5)*5;return String(Math.floor(m/60)).padStart(2,"0")+":"+String(m%60).padStart(2,"0")};
const FR={mango:{n:"มะม่วง",e:"🥭",seed:30,grow:50,base:12,y:[3,5]},marian:{n:"มะปราง",e:"🍑",seed:20,grow:35,base:9,y:[3,6]}};
const OT={fish:{n:"ปลา",e:"🐟",base:16},egg:{n:"ไข่ไก่",e:"🥚",base:7}};
const ALL={...FR,...OT};
const PETS={dog:{n:"หมา",e:"🐶",c:100,d:"ขายของได้ราคา +10%"},cat:{n:"แมว",e:"🐱",c:80,d:"ไล่หนอนศัตรูพืชอัตโนมัติ"},chick:{n:"ไก่",e:"🐔",c:60,d:"ออกไข่ให้ทุก 30 วินาที"}};
const SK=["🧑🏻‍🌾","🧑🏼‍🌾","🧑🏽‍🌾","🧑🏾‍🌾","🧑🏿‍🌾"],HT=["","👒","🧢","🎩"];
const QS=[{k:"h",n:"เก็บผลไม้ 8 ผล",g:8,r:60},{k:"f",n:"ตกปลา 3 ตัว",g:3,r:50},{k:"g",n:"เล่นมินิเกมเก็บมะม่วง 1 รอบ",g:1,r:40},{k:"s",n:"ขายของ 15 ชิ้น",g:15,r:70}];
const NEWS=[["🎉 เทศกาลมะม่วงน้ำปลาหวาน! ราคามะม่วงพุ่ง","mango",1.6],["🌧️ ฝนตกหนัก มะปรางขาดตลาด ราคาขึ้น","marian",1.6],["📉 ผลผลิตล้นตลาด ราคามะม่วงตก","mango",.65],["📉 พ่อค้ากดราคามะปราง","marian",.65],["🍳 ร้านอาหารแย่งซื้อปลา ราคาพุ่ง","fish",1.5],["🥚 ไข่ล้นตลาด ราคาลด","egg",.7]];
const fresh=()=>({name:"",skin:0,hat:1,coins:100,xp:0,t:0,day:1,seed:"mango",pet:null,hap:80,inv:{mango:0,marian:0,fish:0,egg:0},P:Object.fromEntries(Object.entries(ALL).map(([k,v])=>[k,v.base])),H:Object.fromEntries(Object.keys(ALL).map(k=>[k,[ALL[k].base]])),news:"ตลาดเปิดแล้ว ราคาจะขึ้นลงตลอดเวลา",plots:Array.from({length:9},(_,i)=>({u:i<4,k:null,p:0,w:0,bug:0})),q:{h:0,f:0,g:0,s:0,sf:0,pl:0,w:0,b:0,rare:0},qs:{},met:{},fset:{},fauto:0});
let S=null,tab="farm";
try{S=JSON.parse(localStorage.getItem("mangoSave3"))}catch(e){}
const save=()=>{try{localStorage.setItem("mangoSave3",JSON.stringify(S))}catch(e){}};
const lvl=()=>1+Math.floor(Math.sqrt(S.xp/25));
const av=()=>`<span class="av"><i>${HT[S.hat]}</i>${SK[S.skin]}</span>`;
let tt;function toast(t){const e=$("#toast");e.textContent=t;e.style.opacity=1;clearTimeout(tt);tt=setTimeout(()=>e.style.opacity=0,2200)}
/* audio */
let AC,mg,mus=1,sfxOn=1,nx=0,step=0,mi=2;const SC=[0,2,4,7,9,12,14,16];
function aud(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)();mg=AC.createGain();mg.gain.value=.14;mg.connect(AC.destination)}catch(e){return}}if(AC.state=="suspended")AC.resume()}
function note(f,t,d,ty="triangle",v=1){if(!AC)return;const o=AC.createOscillator(),g=AC.createGain();o.type=ty;o.frequency.value=f;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.02);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(mg);o.start(t);o.stop(t+d+.05)}
function sfx(k){if(!AC||!sfxOn)return;const t=AC.currentTime,f={coin:[880,1320],ok:[523,659,784],bad:[200,150],tap:[600]}[k]||[600];f.forEach((x,i)=>note(x,t+i*.08,.18,"square",.5))}
setInterval(()=>{if(!AC||!mus||!S)return;if(nx<AC.currentTime)nx=AC.currentTime+.05;while(nx<AC.currentTime+.6){mi=Math.max(0,Math.min(7,mi+[-2,-1,-1,0,1,1,2][Math.random()*7|0]));if(Math.random()>.15)note(262*2**(SC[mi]/12),nx,.55);if(step%4==0)note(131*2**(SC[[0,2,3,1][(step>>2)%4]]/12),nx,1.5,"sine",.9);nx+=.38;step++}},200);
/* ui */
function hdr(){const h=((S.t%DL)/DL),night=h>.7;document.body.classList.toggle("night",night);$("#hd").innerHTML=`${av()}<div class="hd"><b>${S.name}</b><br>Lv.${lvl()} · วันที่ ${S.day} ${night?"🌙":"☀️"} <b>🕒 ${gtime()}</b></div><div class="coin">🪙 ${Math.floor(S.coins)}</div>`}
function nav(){$("#nv").innerHTML=[["farm","🌳","ฟาร์ม"],["mkt","🏪","ตลาด"],["pet","🐾","สัตว์เลี้ยง"],["fun","🎮","กิจกรรม"],["q","📜","ภารกิจ"],["set","⚙️","ตั้งค่า"]].map(([k,e,n])=>`<button data-t="${k}" class="${tab==k?"on":""}"><span>${e}</span>${n}</button>`).join("")}
function go(t){tab=t;nav();render()}
function render(){const m=$("#mn");({farm:rFarm,mkt:rMkt,pet:rPet,fun:rFun,q:rQ,set:rSet})[tab](m);updFarm();}
/* farm */
function rFarm(m){m.innerHTML=`<div class="row" style="margin-bottom:8px"><span class="mut">ปลูกอะไรดี:</span>${Object.entries(FR).map(([k,v])=>`<button class="chip ${S.seed==k?"on":""}" data-seed="${k}">${v.e} ${v.n} 🪙${v.seed}</button>`).join("")}</div><div class="grid" id="farm">${S.plots.map((p,i)=>`<div class="cell" data-p="${i}"><span class="w"></span><span class="f"></span><b class="t" style="font-weight:400"></b><s class="bar" style="text-decoration:none"><u></u></s></div>`).join("")}</div><p class="mut">แตะช่องว่างเพื่อปลูก · แตะต้นไม้เพื่อรดน้ำ (ต้นไม้โตเมื่อมีน้ำเท่านั้น) · แตะ 🐛 เพื่อจับหนอน · แตะผลสุกเพื่อเก็บเกี่ยว</p>`}
function updFarm(){if(tab!="farm")return;const cs=document.querySelectorAll(".cell");if(!cs.length)return;S.plots.forEach((p,i)=>{const c=cs[i];c.className="cell";const t=c.querySelector(".t"),f=c.querySelector(".f"),w=c.querySelector(".w"),b=c.querySelector("u");f.textContent=w.textContent="";b.style.width=0;if(!p.u){c.classList.add("lk");t.textContent="🔒 🪙"+40*(S.plots.filter(x=>x.u).length-3);return}if(!p.k){t.textContent="➕";t.style.fontSize="22px";return}t.style.fontSize="";const F=FR[p.k],r=p.p/F.grow;t.textContent=r<.3?"🌱":r<.7?"🌿":"🌳";b.style.width=Math.min(100,r*100)+"%";if(r>=1){c.classList.add("rp");f.textContent=F.e}else w.textContent=p.bug?"🐛":p.w>0?"💧":"⚠️"})}
function plot(i){const p=S.plots[i];aud();if(!p.u){const n=S.plots.filter(x=>x.u).length,c=40*(n-3);if(S.coins<c)return toast("เงินไม่พอ ต้องใช้ 🪙"+c);S.coins-=c;p.u=1;sfx("ok");return upd()}
if(!p.k){const F=FR[S.seed];if(S.coins<F.seed)return toast("เงินไม่พอซื้อเมล็ด");S.coins-=F.seed;p.k=S.seed;p.p=0;p.w=25;sfx("tap");return upd()}
if(p.bug){p.bug=0;S.xp+=1;sfx("ok");return upd()}
const F=FR[p.k];if(p.p>=F.grow){const n=F.y[0]+(Math.random()*(F.y[1]-F.y[0]+1)|0);S.inv[p.k]+=n;S.q.h+=n;S.xp+=n*3;p.p=Math.floor(F.grow*.3);p.w=0;sfx("coin");toast(`เก็บได้ ${F.e} ${n} ผล!`);return upd()}
p.w=25;sfx("tap");toast("💧 รดน้ำแล้ว");upd()}
function upd(){hdr();if(tab=="farm")updFarm();else render();save()}
/* market */
function spark(h){const mx=Math.max(...h),mn=Math.min(...h),r=mx-mn||1;return `<svg width="90" height="30" viewBox="0 0 90 30"><polyline fill="none" stroke="var(--pri)" stroke-width="2" points="${h.map((v,i)=>`${i*90/Math.max(1,h.length-1)},${28-(v-mn)/r*26}`).join(" ")}"/></svg>`}
const bonus=()=>(S.pet=="dog"&&S.hap>30?1.1:1)*(S.mae?1.05:1)*(1+.04*(S.up?S.up.t:0));
function rMkt(m){m.innerHTML=`<div class="card" style="background:#ffc84a55">📰 ${S.news}</div>`+Object.entries(ALL).map(([k,v])=>{const h=S.H[k],p=S.P[k],pr=h.length>1?h[h.length-2]:p,up=p>=pr;return `<div class="card row"><div style="font-size:30px">${v.e}</div><div class="sp"><b>${v.n}</b> <span class="mut">มี ${S.inv[k]}</span><br><span style="font-size:20px;font-weight:600">🪙 ${(p*bonus()).toFixed(1)}</span> <span class="${up?"up":"dn"}">${up?"▲":"▼"}</span></div>${spark(h)}${k=="fish"?`<div style="width:100%" class="mut">ตัวคูณราคาปลา ×${(p/v.base).toFixed(2)} · ขายแยกชนิดด้านล่าง ⬇️</div>`:`<div style="width:100%" class="row"><button class="btn ghost" data-s="${k}" data-n="1">ขาย 1</button><button class="btn g" data-s="${k}" data-n="all">ขายทั้งหมด</button></div>`}</div>${k=="fish"?fishPanel():""}`}).join("")+`<p class="mut">ราคาแกว่งทุก 8 วินาที เก็บของไว้รอราคาสูงแล้วค่อยขายได้</p>`}
function sell(k,n){const c=S.inv[k];n=n=="all"?c:Math.min(1,c);if(!n)return toast("ไม่มีของให้ขาย");S.inv[k]-=n;S.coins+=Math.round(n*S.P[k]*bonus());S.q.s+=n;S.xp+=n;sfx("coin");upd()}
/* pet */
function rPet(m){if(!S.pet){m.innerHTML=`<p>รับสัตว์เลี้ยงมาช่วยงานในสวน!</p>`+Object.entries(PETS).map(([k,v])=>`<div class="card row"><span style="font-size:36px">${v.e}</span><div class="sp"><b>${v.n}</b><br><span class="mut">${v.d}</span></div><button class="btn" data-adopt="${k}">🪙${v.c}</button></div>`).join("");return}
const v=PETS[S.pet];m.innerHTML=`<div class="card" style="text-align:center"><div style="font-size:70px">${v.e}</div><b>${v.n}ของ ${S.name}</b><p class="mut">${v.d} (ต้องอารมณ์ดีเกิน 30)</p><div style="height:10px;background:var(--line);border-radius:5px;overflow:hidden"><div style="height:100%;width:${S.hap}%;background:#e5557a"></div></div><p>❤️ ความสุข ${Math.round(S.hap)}%</p><div class="row" style="justify-content:center"><button class="btn" data-pa="feed">🍖 ให้อาหาร</button><button class="btn g" data-pa="play">🎾 เล่นด้วย</button></div><p class="mut">ให้อาหารใช้ปลา 1 ตัว (ถ้าไม่มีจ่าย 🪙5)</p></div>`}
function petAct(a){if(a=="feed"){if(S.inv.fish>0)S.inv.fish--;else if(S.coins>=5)S.coins-=5;else return toast("ไม่มีปลาและเงินไม่พอ");S.hap=Math.min(100,S.hap+35)}else{S.hap=Math.min(100,S.hap+8);S.xp+=1}sfx("ok");upd()}
/* fun & quests */
function rFun(m){m.innerHTML=`<div class="card row"><span style="font-size:40px">🎣</span><div class="sp"><b>ตกปลา</b><br><span class="mut">จับจังหวะกดดึงให้ตรงโซนเขียว</span></div><button class="btn" data-g="fish">เล่น</button></div><div class="card row"><span style="font-size:40px">🧺</span><div class="sp"><b>เก็บมะม่วงตกจากฟ้า</b><br><span class="mut">20 วินาที แตะผลไม้ ระวังหนอน!</span></div><button class="btn" data-g="catch">เล่น</button></div>`}
function rQ(m){m.innerHTML=`<p class="mut">ภารกิจรีเซ็ตทุกวัน (1 วันในเกม = 2 นาที)</p>`+QS.map((q,i)=>{const v=Math.min(q.g,S.q[q.k]),ok=v>=q.g;return `<div class="card row"><div class="sp"><b>${q.n}</b><br><span class="mut">${v}/${q.g} · รางวัล 🪙${q.r}</span></div><button class="btn g" data-q="${i}" ${!ok||S.q.c[i]?"disabled":""}>${S.q.c[i]?"รับแล้ว":"รับ"}</button></div>`}).join("")}
/* modal */
let mc=null;function openM(h,c){aud();mc=c;const m=$("#m");m.innerHTML=`<div class="box">${h}<br><button class="btn ghost" id="mx" style="margin-top:10px">ปิด</button></div>`;m.style.display="flex";$("#mx").onclick=closeM}
function closeM(){if(mc)mc();mc=null;$("#m").style.display="none";upd()}
function fishGame(){let st=0,raf,to,z=0,t0=0,pos=0;openM(`<h3>🎣 ตกปลา</h3><p id="fm">กดปล่อยเบ็ด แล้วรอปลากินเหยื่อ</p><div class="fb"><div id="fz"></div><div id="fk" style="left:0"></div></div><button class="btn" id="fgo">ปล่อยเบ็ด</button>`,()=>{cancelAnimationFrame(raf);clearTimeout(to)});
const fm=$("#fm"),fz=$("#fz"),fk=$("#fk"),b=$("#fgo");const loop=t=>{pos=(Math.sin((t-t0)/230)+1)/2*96;fk.style.left=pos+"%";raf=requestAnimationFrame(loop)};
b.onclick=()=>{if(st==0){st=1;fm.textContent="รอปลา... 🌊";b.disabled=true;to=setTimeout(()=>{st=2;z=5+Math.random()*60;fz.style.left=z+"%";fm.textContent="ปลากินเบ็ดแล้ว! กดตอนขีดแดงอยู่ในโซนเขียว";b.disabled=false;b.textContent="ดึง!";t0=performance.now();raf=requestAnimationFrame(loop)},900+Math.random()*2200)}else if(st==2){cancelAnimationFrame(raf);st=0;b.textContent="ปล่อยเบ็ดอีกครั้ง";if(pos>=z-2&&pos<=z+30){if(Math.random()<.12){S.coins+=30;fm.textContent="🐠 ได้ปลาสวยงาม ขายได้ 🪙30!"}else{S.inv.fish++;fm.textContent="🐟 ได้ปลา 1 ตัว!"}S.q.f++;S.xp+=5;sfx("ok")}else{fm.textContent="ปลาหลุด! ลองใหม่";sfx("bad")}hdr();save()}}}

function statUI(){const h=`<h3>⭐ อัพสถานะ</h3><p class="mut" style="margin:0 0 8px">Lv.${lvl()} · แต้มที่เหลือ <b>${S.sp}</b> (ได้ 1 แต้มทุกเลเวล)</p>${S.sp<1?`<p class="mut" style="margin:0 0 8px;color:#e5a000">🔒 ยังไม่มีแต้ม เก็บ XP ให้เลเวลอัพก่อนนะ</p>`:""}`+UPS.map(([k,e,n,d])=>{const v=S.up[k];return `<div class="row" style="margin-bottom:8px;text-align:left"><span style="font-size:28px">${e}</span><div class="sp"><b>${n}</b> <span class="mut">${v}/${UMAX}</span><br><span class="mut" style="font-size:12px">${d}</span></div><button class="btn g" data-up="${k}" ${S.sp<1||v>=UMAX?"disabled":""} style="min-width:64px">${v>=UMAX?"เต็ม":"＋ อัพ"}</button></div>`}).join("");openM(h)}
document.addEventListener("click",e=>{const u=e.target.closest("[data-up]");if(u){const k=u.dataset.up;if(S.sp<1||S.up[k]>=UMAX)return;S.sp--;S.up[k]++;sfx("ok");save();hdr();statUI();return}if(S.up&&e.target.closest("#hd")&&$("#m").style.display!="flex")statUI()});
const _tk=tick;tick=function(){_tk();if(!S.up)return;if(S.up.g)S.plots.forEach(p=>{if(p.u&&p.k&&!p.bug&&p.w>0&&p.p<FR[p.k].grow&&Math.random()<.1*S.up.g)p.p++});if(S.pet&&S.up.p){S.hun=Math.min(100,S.hun+.016*S.up.p);S.hap=Math.min(100,S.hap+.02*S.up.p)}};
start();
</script></body></html>
